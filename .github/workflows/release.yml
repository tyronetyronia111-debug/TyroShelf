name: Build and release

# Push a tag like "v17" (git tag v17 && git push origin v17) and this builds the Windows portable exe
# and attaches it to a GitHub Release. "Run workflow" on the Actions tab builds without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp the build number and repository into package.json
        if: github.ref_type == 'tag'
        shell: bash
        # the tag "v18" becomes build 18; the in-app updater compares it with the newest release's tag on this repository
        run: |
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8'));p.tyroBuild=+process.env.GITHUB_REF_NAME.replace(/^v/,'');p.tyroRepo=process.env.GITHUB_REPOSITORY;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          grep -E '"tyro(Build|Repo)"' package.json
      - run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Name the exe after the tag
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || ver="dev"
          mv dist/Tyro-Shelf.exe "dist/Tyro-Shelf-${ver}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Tyro-Shelf
          path: dist/Tyro-Shelf-*.exe
      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Tyro-Shelf-*.exe
          generate_release_notes: true
