name: Build and release

# Push a tag like "v17" (git tag v17 && git push origin v17) and this builds the Windows portable exe
# and attaches it to a GitHub Release. "Run workflow" on the Actions tab builds without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Name the exe after the tag
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || ver="dev"
          mv dist/Tyro-Shelf.exe "dist/Tyro-Shelf-${ver}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Tyro-Shelf
          path: dist/Tyro-Shelf-*.exe
      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Tyro-Shelf-*.exe
          generate_release_notes: true
